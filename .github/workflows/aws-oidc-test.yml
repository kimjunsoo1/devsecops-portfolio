# 모듈 2 검증용 워크플로.
name: aws-oidc-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    name: AWS 신원 확인
    runs-on: ubuntu-latest
    steps:
      - name: OIDC 토큰의 실제 클레임 확인
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info('iss = ' + payload.iss);
            core.info('aud = ' + payload.aud);
            core.info('sub = ' + payload.sub);
            core.info('repository = ' + payload.repository);

      - name: AWS 자격증명 획득 (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: gha-${{ github.run_id }}

      - name: 나는 누구인가
        run: aws sts get-caller-identity

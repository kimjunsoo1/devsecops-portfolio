# 4주차 모듈 1 — IaC 전용 검사를 붙입니다.
#
# 3주차와 같은 순서를 따릅니다: 먼저 보이게 만들고, 무엇을 차단할지는
# 전체 그림을 본 뒤에 정합니다. 이 워크플로는 아직 아무것도 막지 않습니다.
#
# 역할 구분:
#   Trivy    - IaC 오구성 (이미 3주차에 도입, 범용 스캐너)
#   Checkov  - IaC 정책 전용. 룰 수가 훨씬 많고 Terraform 의미를 더 깊게 봄
#   tflint   - 보안이 아니라 "Terraform 코드로서의 결함". 쓰이지 않는 변수,
#              잘못된 참조, 폐기된 문법, 명명 규칙
#
# Trivy 와 Checkov 가 겹치는 지적을 낼 수 있습니다. 그것도 정보입니다 —
# 둘 다 잡으면 확실하고, 한쪽만 잡으면 그 도구의 강점이 드러납니다.

name: iac

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 매주 월요일 03:00 KST
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  checkov:
    name: IaC 정책 (Checkov)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # 억제 주석의 근거와 기한을 검사합니다.
      #
      # Checkov 인라인 억제에는 Trivy 의 expired_at 같은 기한 장치가 없어서
      # 직접 만들었습니다. 2026-11-03 에 Trivy 의 AWS-0011 유예가 만료되어
      # 게이트를 막았고, 그 덕에 WAF 적용 결정을 더 미루지 못했습니다.
      # Checkov 로 억제를 이관하면 그 강제력이 사라지므로 이 검사가 필요합니다.
      #
      # 이 단계는 처음부터 게이트입니다. 다른 스캐너와 달리 관찰 기간이
      # 필요하지 않습니다 - 실패시키는 것이 존재 목적이기 때문입니다.
      - name: 억제 주석 검사
        run: python3 scripts/check-suppressions.py

      - name: Checkov 설치
        run: pip install -r requirements-ci.txt

      # --soft-fail: 발견 사항이 있어도 실패시키지 않습니다.
      # 리포트 파일은 워크스페이스 밖에 씁니다 — 3주차에 스캐너가 자기 리포트를
      # 스캔해서 오탐이 났던 문제를 되풀이하지 않기 위해서입니다.
      - name: 스캔 (리포트)
        run: |
          checkov --directory . --framework terraform --output sarif --output-file-path "$RUNNER_TEMP" --soft-fail --quiet

      - name: SARIF 업로드
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # checkov 는 --output-file-path 를 디렉터리로만 해석하고 파일명을
          # results_<형식>.<확장자> 로 직접 정합니다. 파일명을 주면 그 이름의
          # 디렉터리를 만듭니다. 추측이 아니라 로컬에서 측정해 확인한 동작입니다.
          sarif_file: ${{ runner.temp }}/results_sarif.sarif
          category: checkov
        if: always()

      # 2단계: 게이트. --soft-fail 없이 돌려 발견사항이 하나라도 있으면
      # PR 을 막습니다.
      #
      # 억제한 24건은 Skipped 로 집계되어 실패에 포함되지 않습니다. 즉 이
      # 게이트를 통과하려면 "고치거나 근거를 쓰거나" 둘 중 하나를 해야 하고,
      # 근거에는 scripts/check-suppressions.py 가 기한 표기를 요구합니다.
      # 조용히 넘기는 경로가 없는 것이 설계 의도입니다.
      - name: 게이트
        run: checkov --directory . --framework terraform --compact --quiet

  tflint:
    name: IaC 린트 (tflint)
    runs-on: ubuntu-latest

    env:
      # --recursive 로 하위 디렉터리를 돌 때도 루트 설정을 쓰게 합니다.
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: 플러그인 초기화
        run: tflint --init
        env:
          # 플러그인을 GitHub 릴리스에서 받습니다. 토큰이 없으면 rate limit 에 걸립니다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 모듈 4 에서 게이트로 승격했습니다. tflint 가 잡는 것은 보안이
      # 아니라 Terraform 코드로서의 결함이지만, 미사용 선언이나 폐기된
      # 문법을 방치하면 다음 사람이 그게 의도인지 실수인지 알 수 없습니다.
      - name: 린트
        run: tflint --recursive --format compact

# 4주차 모듈 1 — IaC 전용 검사를 붙입니다.
#
# 3주차와 같은 순서를 따릅니다: 먼저 보이게 만들고, 무엇을 차단할지는
# 전체 그림을 본 뒤에 정합니다. 이 워크플로는 아직 아무것도 막지 않습니다.
#
# 역할 구분:
#   Trivy    - IaC 오구성 (이미 3주차에 도입, 범용 스캐너)
#   Checkov  - IaC 정책 전용. 룰 수가 훨씬 많고 Terraform 의미를 더 깊게 봄
#   tflint   - 보안이 아니라 "Terraform 코드로서의 결함". 쓰이지 않는 변수,
#              잘못된 참조, 폐기된 문법, 명명 규칙
#
# Trivy 와 Checkov 가 겹치는 지적을 낼 수 있습니다. 그것도 정보입니다 —
# 둘 다 잡으면 확실하고, 한쪽만 잡으면 그 도구의 강점이 드러납니다.

name: iac

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 매주 월요일 03:00 KST
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  checkov:
    name: IaC 정책 (Checkov)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Checkov 설치
        run: pip install checkov

      # --soft-fail: 발견 사항이 있어도 실패시키지 않습니다.
      # 리포트 파일은 워크스페이스 밖에 씁니다 — 3주차에 스캐너가 자기 리포트를
      # 스캔해서 오탐이 났던 문제를 되풀이하지 않기 위해서입니다.
      - name: 스캔 (리포트)
        run: |
          checkov --directory . --framework terraform --output sarif --output-file-path "$RUNNER_TEMP" --soft-fail --quiet

      - name: SARIF 업로드
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: ${{ runner.temp }}/results.sarif
          category: checkov
        if: always()

  tflint:
    name: IaC 린트 (tflint)
    runs-on: ubuntu-latest

    env:
      # --recursive 로 하위 디렉터리를 돌 때도 루트 설정을 쓰게 합니다.
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4

      - name: 플러그인 초기화
        run: tflint --init
        env:
          # 플러그인을 GitHub 릴리스에서 받습니다. 토큰이 없으면 rate limit 에 걸립니다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 모듈 1 은 리포트 전용입니다. 모듈 2 에서 게이트로 올립니다.
      - name: 린트
        run: tflint --recursive --format compact
        continue-on-error: true

# 3주차 모듈 1 — 보안 스캔 결과를 GitHub Security 탭으로 흘려보냅니다.
#
# 이 단계는 "보이게 만드는" 것까지만 합니다. 아직 게이트가 아닙니다.
# 발견 사항이 있어도 PR 은 막히지 않습니다 - 모듈 2 에서 승격합니다.
#
# 먼저 전체 그림을 보고, 무엇을 차단할지 그다음에 정하는 순서입니다.
# 처음부터 막아버리면 기존 코드의 지적사항 수십 개에 파묻혀서
# 결국 전부 무시하게 됩니다.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 매주 월요일 03:00 KST - 코드가 안 바뀌어도 새 취약점은 계속 나옵니다.
    - cron: '0 18 * * 0'

# 기본은 읽기만. 필요한 잡에서만 권한을 늘립니다.
permissions:
  contents: read

jobs:
  sast:
    name: 코드 (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Semgrep 설치
        run: pip install semgrep

      # 룰셋은 목적별로 고릅니다.
      #   p/security-audit  - 일반적인 취약 패턴
      #   p/secrets         - 하드코딩된 자격증명
      #   p/terraform       - IaC 오구성
      #   p/github-actions  - 워크플로 자체의 취약점 (스크립트 인젝션 등)
      #
      # --metrics=off 로 텔레메트리를 끕니다.
      - name: 스캔
        run: |
          semgrep scan --config=p/security-audit --config=p/secrets --config=p/terraform --config=p/github-actions --sarif --output=semgrep.sarif --metrics=off
        continue-on-error: true

      - name: SARIF 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  deps:
    name: 의존성·설정 (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # curl | sh 대신 서명된 apt 저장소를 씁니다.
      # 보안 도구를 검증 없이 받아 실행하는 건 그 자체로 공급망 문제입니다.
      - name: Trivy 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # vuln     - package-lock.json 의 취약한 패키지
      # secret   - 커밋된 자격증명
      # misconfig- Terraform / Dockerfile / 워크플로 오구성
      - name: 스캔
        run: |
          trivy fs --scanners vuln,secret,misconfig --format sarif --output trivy.sarif --exit-code 0 .

      - name: SARIF 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

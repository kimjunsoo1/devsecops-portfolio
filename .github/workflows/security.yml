# 3주차 모듈 2 — 스캔을 게이트로 승격합니다.
#
# 차단 기준: docs/security-policy.md
#   gitleaks - 발견 시 무조건 차단 (ci.yml)
#   Semgrep  - ERROR 등급만 차단
#   Trivy    - HIGH/CRITICAL 만 차단, .trivyignore.yaml 로 수용한 항목 제외
#
# 리포트 파일은 워크스페이스가 아니라 runner.temp 에 씁니다.
# 리포지토리 안에 두면 뒤따르는 게이트 단계가 그 리포트를 스캔 대상으로 잡고,
# 리포트에 들어 있는 룰 설명 텍스트에 자기 룰이 매칭되어 오탐이 납니다.
# (SARIF 는 JSON 이고 YAML 은 JSON 의 상위집합이라 YAML 룰이 그대로 읽습니다.)

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 매주 월요일 03:00 KST - 코드가 안 바뀌어도 새 취약점은 계속 나옵니다.
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  sast:
    name: 코드 (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    env:
      SEMGREP_CONFIGS: >-
        --config=p/security-audit
        --config=p/secrets
        --config=p/terraform
        --config=p/github-actions

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Semgrep 설치
        run: pip install semgrep

      # 1단계: 전체 결과를 SARIF 로 뽑아 Security 탭에 올립니다.
      # 등급과 무관하게 전부 보이게 하는 것이 목적이므로 실패시키지 않습니다.
      - name: 스캔 (리포트)
        run: |
          semgrep scan $SEMGREP_CONFIGS --sarif --output="$RUNNER_TEMP/semgrep.sarif" --metrics=off
        continue-on-error: true

      - name: SARIF 업로드
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep
        if: always()

      # 2단계: ERROR 등급만 게이트. 여기서 실패하면 PR 이 막힙니다.
      - name: 게이트 (ERROR 등급)
        run: |
          semgrep scan $SEMGREP_CONFIGS --severity=ERROR --error --metrics=off

  deps:
    name: 의존성·설정 (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # curl | sh 대신 서명된 apt 저장소를 씁니다.
      # 보안 도구를 검증 없이 받아 실행하는 건 그 자체로 공급망 문제입니다.
      - name: Trivy 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # 1단계: 전체 결과를 Security 탭으로. 억제 목록을 적용하지 않습니다 -
      # 수용한 항목도 계속 보이는 편이 낫습니다.
      - name: 스캔 (리포트)
        run: |
          trivy fs --scanners vuln,secret,misconfig --format sarif --output "$RUNNER_TEMP/trivy.sarif" --exit-code 0 .

      - name: SARIF 업로드
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy
        if: always()

      # 2단계: 게이트. 억제 목록에 없는 HIGH/CRITICAL 이 하나라도 있으면 실패합니다.
      - name: 게이트 (HIGH/CRITICAL)
        run: |
          trivy fs --scanners vuln,secret,misconfig --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 --format table .

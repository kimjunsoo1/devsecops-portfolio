# 3주차 모듈 2 — 스캔을 게이트로 승격합니다.
#
# 모듈 1 은 리포트 전용이었습니다. 전체 27건을 분류한 뒤
# 차단 기준을 정했습니다: docs/security-policy.md
#
#   gitleaks - 발견 시 무조건 차단 (ci.yml)
#   Semgrep  - ERROR 등급만 차단
#   Trivy    - HIGH/CRITICAL 만 차단, .trivyignore.yaml 로 수용한 항목 제외
#
# 등급이 낮은 항목은 차단하지 않지만 Security 탭에는 계속 올립니다.
# 해결되지 않았다는 사실이 사라지지 않게 하려는 것입니다.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 매주 월요일 03:00 KST - 코드가 안 바뀌어도 새 취약점은 계속 나옵니다.
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  sast:
    name: 코드 (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Semgrep 설치
        run: pip install semgrep

      # 1단계: 전체 결과를 SARIF 로 뽑아 Security 탭에 올립니다.
      # 등급과 무관하게 전부 보이게 하는 것이 목적이므로 실패시키지 않습니다.
      - name: 스캔 (리포트)
        run: |
          semgrep scan --config=p/security-audit --config=p/secrets --config=p/terraform --config=p/github-actions --sarif --output=semgrep.sarif --metrics=off
        continue-on-error: true

      - name: SARIF 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        if: always()

      # 2단계: ERROR 등급만 게이트. 여기서 실패하면 PR 이 막힙니다.
      - name: 게이트 (ERROR 등급)
        run: |
          semgrep scan --config=p/security-audit --config=p/secrets --config=p/terraform --config=p/github-actions --severity=ERROR --error --metrics=off

  deps:
    name: 의존성·설정 (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # curl | sh 대신 서명된 apt 저장소를 씁니다.
      # 보안 도구를 검증 없이 받아 실행하는 건 그 자체로 공급망 문제입니다.
      - name: Trivy 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # 1단계: 전체 결과를 Security 탭으로. 억제 목록을 적용하지 않습니다 —
      # 수용한 항목도 계속 보이는 편이 낫습니다.
      - name: 스캔 (리포트)
        run: |
          trivy fs --scanners vuln,secret,misconfig --format sarif --output trivy.sarif --exit-code 0 .

      - name: SARIF 업로드
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
        if: always()

      # 2단계: 게이트. 억제 목록에 없는 HIGH/CRITICAL 이 하나라도 있으면 실패합니다.
      - name: 게이트 (HIGH/CRITICAL)
        run: |
          trivy fs --scanners vuln,secret,misconfig --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 --format table .

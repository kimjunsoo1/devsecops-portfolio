# 6주차 공급망 검증 — 서명 변조 테스트 (회귀)
#
# 목적: cosign 서명 검증이 변조된 산출물을 실제로 거부하는지 확인한다.
# deploy.yml 의 검증 게이트와 같은 메커니즘을, 독립적으로 시험한다.
#
# 거부가 성공이다. 변조본이 검증을 통과하면 그것이 발견사항이다 -
# 서명이 무결성을 보증하지 못한다는 뜻이기 때문이다.
#
# 중요: cosign 의 exit 코드를 파이프 없이 직접 받는다. "cosign ... | tail"
# 처럼 파이프로 받으면 $? 가 tail 의 exit(0)을 잡아, 거부 메시지가 보여도
# 자동화는 통과로 읽는다. 거부가 보이는 것과 exit 이 비0 인 것은 다르다.
#
# 안전성: 더미 파일을 서명·검증할 뿐 배포에 손대지 않는다. 서명은 Rekor 에
# 올라가지만 더미 콘텐츠의 해시일 뿐이다. 본인 리포지토리만 대상으로 한다.

name: signing-tamper-test

on:
  workflow_dispatch:

permissions:
  id-token: write   # cosign keyless 서명
  contents: read

jobs:
  tamper:
    name: 서명 검증이 변조를 거부하는가
    runs-on: ubuntu-latest
    env:
      EXPECTED_ISSUER: https://token.actions.githubusercontent.com
      EXPECTED_IDENTITY_RE: "^https://github.com/kimjunsoo1/devsecops-portfolio/\\.github/workflows/signing-tamper-test\\.yml@refs/heads/main$"
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: 더미 산출물 생성 및 서명
        run: |
          echo "supply-chain integrity test payload $(date -u +%s)" > "$RUNNER_TEMP/payload.bin"
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/payload.bin.bundle" \
            "$RUNNER_TEMP/payload.bin"
          echo "서명 번들 생성됨."

      - name: 변조 테스트
        run: |
          # verify() 가 변조본에 의도적으로 비0 을 반환한다. GitHub Actions 의
          # 기본 bash -e 는 그 비0 에서 스크립트를 죽이므로, 이 구간만 -e 를
          # 끈다. 판정은 아래 if 에서 수동 exit 으로 제어한다.
          set +e
          cd "$RUNNER_TEMP"
          verify() {
            cosign verify-blob \
              --bundle payload.bin.bundle \
              --certificate-oidc-issuer "$EXPECTED_ISSUER" \
              --certificate-identity-regexp "$EXPECTED_IDENTITY_RE" \
              "$1" >/dev/null 2>&1
            return $?
          }

          # 1) 정상 산출물 — exit 0 이어야 한다
          verify payload.bin; NORMAL=$?
          echo "정상 산출물 검증  exit=$NORMAL"

          # 2) 변조 산출물 — exit 비0 이어야 한다
          cp payload.bin tampered.bin
          printf '\x00' | dd of=tampered.bin bs=1 seek=5 count=1 conv=notrunc 2>/dev/null
          verify tampered.bin; TAMPER=$?
          echo "변조 산출물 검증  exit=$TAMPER"

          # 판정: 정상 통과(0) 이고 변조 거부(비0) 여야 PASS
          echo
          if [ "$NORMAL" -eq 0 ] && [ "$TAMPER" -ne 0 ]; then
            echo "PASS — 서명이 변조를 막는다 (정상 통과, 변조 거부)"
            exit 0
          else
            echo "FINDING — 서명 무결성 보증이 동작하지 않는다."
            echo "  정상 exit=$NORMAL (0 기대), 변조 exit=$TAMPER (비0 기대)"
            exit 1
          fi

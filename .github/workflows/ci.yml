# 1주차 CI — 아직 최소 구성입니다.
# 3주차에 Semgrep / Trivy / SARIF 업로드, 4주차에 Checkov / Conftest 가 여기 붙습니다.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# 기본 권한을 읽기로 좁힙니다. 필요한 잡에서만 늘립니다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 시크릿 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks 가 커밋 히스토리 전체를 봐야 합니다
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 퍼블릭 리포지토리는 라이선스 없이 무료입니다.

  terraform:
    name: Terraform 정적 검사
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, guardrails, site]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.0"

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init (백엔드 없이)
        run: terraform init -backend=false

      - name: validate
        run: terraform validate -no-color

  actions-pinned:
    name: 액션 고정 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      # 모든 액션이 커밋 SHA 로 고정되어 있는지, 같은 액션이 여러 파일에서
      # 같은 SHA 를 쓰는지 검사합니다. 네트워크를 쓰지 않습니다.
      #
      # 왜 필요한가: Dependabot 은 액션 경로별로 PR 을 따로 만듭니다.
      # codeql-action 의 init / analyze / upload-sarif 가 서로 다른 릴리스로
      # 갈라질 수 있고, init 과 analyze 가 어긋나면 CodeQL 이 깨집니다.
      # 2026-11-03 에 실제로 그 상태가 되었고 사람이 눈으로 잡았습니다.
      # 기계가 할 일입니다.
      - name: pin-actions --check
        run: python3 scripts/pin-actions.py --check

# 정적 사이트 배포.
#
# main 에 site/ 변경이 들어오면 빌드해서 S3 에 올리고 CloudFront 캐시를 비웁니다.
# AWS 자격증명은 저장하지 않습니다 - OIDC 로 매 실행마다 새로 받습니다.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 배포가 겹치면 순서가 꼬입니다. 앞 배포가 끝날 때까지 기다립니다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: 빌드 후 배포
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # npm install 이 아니라 npm ci 입니다.
      # package-lock.json 을 그대로 따르므로 로컬과 CI 의 의존성이 갈리지 않습니다.
      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      # ── 6주차 모듈 1: SBOM 생성 (리포트 전용) ──
      # package-lock.json 기준으로 전체 의존성 트리의 CycloneDX SBOM 을
      # 만든다. dist/ 가 아니라 소스를 보는 이유: dist/ 는 번들된 결과라
      # 원본 패키지 정보가 사라진다. "배포 파일에 뭐가 들어갔나"가 아니라
      # "이 사이트가 어떤 의존성으로 만들어졌나"가 공급망 질문이다.
      # 아직 배포를 막지 않는다. 모듈 2 에서 서명·검증 게이트를 올린다.
      # syft 를 고정 버전 바이너리로 받는다. curl | sh 는 쓰지 않는다 -
      # 원격 스크립트를 받아 즉시 실행하는 공급망 안티패턴이고, Semgrep
      # gha-curl-pipe-shell 게이트가 막는다. 체크섬을 확인하고 실행한다.
      - name: syft 설치
        env:
          SYFT_VERSION: "1.57.1"
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl -sSfL -o syft.tar.gz    "${base}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o checksums.txt  "${base}/syft_${SYFT_VERSION}_checksums.txt"
          grep "syft_${SYFT_VERSION}_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar xzf syft.tar.gz syft
          sudo mv syft /usr/local/bin/syft
          syft version

      - name: SBOM 생성 (CycloneDX)
        run: |
          syft scan dir:. \
            --source-name devsecops-portfolio-site \
            --exclude './node_modules' \
            --exclude './dist' \
            -o cyclonedx-json="$RUNNER_TEMP/sbom.cdx.json"
          echo "컴포넌트 수: $(python3 -c "import json;print(len(json.load(open('$RUNNER_TEMP/sbom.cdx.json')).get('components',[])))")"

      - name: SBOM 업로드 (증적)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom.cdx.json
          retention-days: 90

      - name: AWS 자격증명 획득 (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: deploy-${{ github.run_id }}

      # 해시가 붙은 자산(/_astro/*)은 내용이 바뀌면 파일명이 바뀝니다.
      # 그래서 1년 캐시에 immutable 을 걸어도 안전합니다.
      - name: 자산 업로드 (긴 캐시)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_SITE_BUCKET }}/" --delete --cache-control "public,max-age=31536000,immutable" --exclude "*.html" --exclude "*.xml" --exclude "*.txt"

      # HTML 은 주소가 그대로이므로 캐시하면 안 됩니다.
      # --delete 는 필터 범위 안에서만 동작하므로 위에서 올린 자산은 지워지지 않습니다.
      - name: HTML 업로드 (캐시 없음)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_SITE_BUCKET }}/" --delete --cache-control "public,max-age=0,must-revalidate" --exclude "*" --include "*.html" --include "*.xml" --include "*.txt"

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ secrets.AWS_DISTRIBUTION_ID }}" --paths "/*"

      - name: 배포 결과
        run: echo "배포 완료 - https://${{ secrets.AWS_DISTRIBUTION_DOMAIN }}"

# 정적 사이트 배포 — 빌드·서명(build) 과 검증·배포(deploy) 를 분리한다.
#
# 왜 두 잡인가: 서명과 검증이 같은 잡 안에 있으면 중간에 바뀔 틈이 없어
# 검증이 통과할 수밖에 없다. artifact 가 잡 경계를 건너야 "build 가 서명한
# 그 산출물이 변조 없이 왔는지"를 검증이 실제로 확인한다.
#
# 서명: cosign keyless (OIDC). 관리할 개인키가 없다. Fulcio 가 발급한
# 단명 인증서에 워크플로 신원이 박히고, Rekor 투명성 로그에 기록된다.
# 검증: 그 신원이 "main 브랜치의 이 워크플로"와 일치해야만 통과한다.
# OIDC trust policy(5주차)와 같은 경계를 서명 계층에 세운다.
#
# AWS 자격증명은 저장하지 않는다 - OIDC 로 매 실행마다 새로 받는다.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write   # build: cosign 서명 / deploy: AWS OIDC
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  build:
    name: 빌드 및 서명
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # npm install 이 아니라 npm ci. package-lock.json 을 그대로 따른다.
      - name: 의존성 설치
        working-directory: site
        run: npm ci

      - name: 빌드
        working-directory: site
        run: npm run build

      # ── 6주차 모듈 1: SBOM (리포트 전용) ──
      # package-lock.json 기준 전체 의존성 트리의 CycloneDX SBOM.
      - name: SBOM 생성 (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./site
          format: cyclonedx-json
          artifact-name: sbom-${{ github.sha }}.cdx.json
          output-file: ${{ runner.temp }}/sbom.cdx.json

      # ── 6주차 모듈 2: 산출물 압축 후 서명 ──
      # dist 를 하나의 tarball 로 묶어 서명한다. 서명 대상이 바이트 단위로
      # 고정되어야 검증이 의미를 갖는다. 이 tarball 그대로 artifact 로
      # 넘어가고, deploy 는 검증 후 이 tarball 만 푼다.
      - name: dist 압축
        run: tar czf "$RUNNER_TEMP/site-dist.tar.gz" -C site dist

      - name: cosign 설치
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # keyless 서명. --yes 로 대화형 확인을 건너뛴다. GitHub Actions 의
      # ambient OIDC 토큰을 cosign 이 자동 감지한다(id-token: write 필요).
      # 서명과 인증서를 파일로 뽑고, 서명 기록은 Rekor 에 올라간다.
      - name: 산출물 서명 (keyless)
        run: |
          # cosign v4 는 서명과 인증서를 하나의 번들 파일로 묶는다.
          # (--new-bundle-format 은 v4 기본값이라 명시하지 않아도 적용된다.)
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/site-dist.tar.gz.bundle" \
            "$RUNNER_TEMP/site-dist.tar.gz"
          echo "서명 번들 생성됨."

      # tarball + 서명 + 인증서를 한 artifact 로 묶어 deploy 에 넘긴다.
      - name: 서명된 산출물 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-site-${{ github.sha }}
          path: |
            ${{ runner.temp }}/site-dist.tar.gz
            ${{ runner.temp }}/site-dist.tar.gz.bundle
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 검증 및 배포
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 서명된 산출물 다운로드
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-site-${{ github.sha }}
          path: ${{ runner.temp }}/signed

      - name: cosign 설치
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # ── 검증 게이트 ──
      # 서명이 "main 브랜치의 이 워크플로"가 만든 것인지 확인한다. 신원이
      # 다르면(다른 브랜치, 다른 워크플로, 외부자) 여기서 실패하고 배포가
      # 멈춘다. OIDC trust policy 와 같은 완전 일치 경계다.
      #
      # 주의: 아래 --certificate-identity 는 첫 실행에서 실제 인증서 SAN 을
      # 확인해 확정해야 한다. 우선 regexp 로 느슨하게 걸어 서명이 통과하는지
      # 보고, 실제 신원을 확인한 뒤 완전 일치로 좁힌다. 추측으로 박지 않는다.
      - name: 산출물 서명 검증 (게이트)
        env:
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
          EXPECTED_IDENTITY_RE: "^https://github.com/kimjunsoo1/devsecops-portfolio/\\.github/workflows/deploy\\.yml@refs/heads/main$"
        run: |
          cd "$RUNNER_TEMP/signed"
          cosign verify-blob \
            --bundle "site-dist.tar.gz.bundle" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            --certificate-identity-regexp "$EXPECTED_IDENTITY_RE" \
            "site-dist.tar.gz"
          echo "검증 통과 — 서명 신원이 기대값과 일치. 배포를 진행한다."

      - name: 산출물 전개
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar xzf "$RUNNER_TEMP/signed/site-dist.tar.gz" -C "$RUNNER_TEMP/site"
          ls -la "$RUNNER_TEMP/site/dist" | head

      - name: AWS 자격증명 획득 (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: deploy-${{ github.run_id }}

      # 해시가 붙은 자산(/_astro/*)은 내용이 바뀌면 파일명이 바뀐다.
      # 그래서 1년 캐시에 immutable 을 걸어도 안전하다.
      - name: 자산 업로드 (긴 캐시)
        run: |
          aws s3 sync "$RUNNER_TEMP/site/dist/" "s3://${{ secrets.AWS_SITE_BUCKET }}/" --delete --cache-control "public,max-age=31536000,immutable" --exclude "*.html" --exclude "*.xml" --exclude "*.txt"

      # HTML 은 주소가 그대로이므로 캐시하면 안 된다.
      - name: HTML 업로드 (캐시 없음)
        run: |
          aws s3 sync "$RUNNER_TEMP/site/dist/" "s3://${{ secrets.AWS_SITE_BUCKET }}/" --delete --cache-control "public,max-age=0,must-revalidate" --exclude "*" --include "*.html" --include "*.xml" --include "*.txt"

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ secrets.AWS_DISTRIBUTION_ID }}" --paths "/*"

      - name: 배포 결과
        run: echo "배포 완료 - https://${{ secrets.AWS_DISTRIBUTION_DOMAIN }}"

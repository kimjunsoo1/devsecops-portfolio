# 설치:  pre-commit install
# 전체 실행: pre-commit run --all-files
#
# 여기서 막히는 것은 CI 에서도 막힙니다. 커밋 전에 걸리는 편이 항상 쌉니다.

# 위 rev 값들은 작성 시점 기준입니다. 처음 설치한 뒤 한 번:
#   pre-commit autoupdate
# 를 돌려 최신 버전으로 올리고, 그 결과를 커밋하세요.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # 시크릿 스캔 — 1주차의 핵심 훅
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      # 이 훅은 내부적으로 `terraform init -backend=false` 를 먼저 돌리므로
      # 원격 백엔드가 없어도 동작합니다.
      - id: terraform_validate

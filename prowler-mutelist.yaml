        # [ACCEPT] AWS Config 레코더 상시 과금, 개인 포트폴리오 범위 밖 | permanent
        "config_recorder_all_regions_enabled": { Regions: ["*"], Resources: ["*"] }
        # [N/A] DRS(재해복구) 엔터프라이즈 범위, 포트폴리오 대상 아님 | permanent

        # [N/A] 단일 계정 조직, GuardDuty 중앙관리 전제 불가 | permanent
        "guardduty_centrally_managed": { Regions: ["*"], Resources: ["*"] }
        # [N/A] EKS 미사용 + 유료 런타임 모니터링 | permanent
        "guardduty_eks_runtime_monitoring_enabled": { Regions: ["*"], Resources: ["*"] }
        # [N/A] Amazon Bedrock 미사용(SSO 롤 대상 오탐) | permanent
        "iam_role_access_not_stale_to_bedrock": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] Inspector2 유료 취약점 스캐너, 비용상 범위 밖 | permanent
        "inspector2_is_enabled": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] Macie 유료 S3 민감정보 스캐너, 비용상 범위 밖 | permanent

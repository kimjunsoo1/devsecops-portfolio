        "cloudwatch_changes_to_vpcs_alarm_configured": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] 로그 보관 90일(비용 절충); CIS 365일은 포트폴리오 범위에서 과함 | permanent
        "cloudwatch_log_group_retention_policy_specific_days_enabled": { Regions: ["*"], Resources: ["*"] }
        # [REVISIT] AWS Config 미사용이라 현재 무의미; Config 도입 시 필터 추가 | revisit=2027-05-31
        "cloudwatch_log_metric_filter_and_alarm_for_aws_config_configuration_changes_enabled": { Regions: ["*"], Resources: ["*"] }
        # [REVISIT] 인증 실패 메트릭 필터 추가 검토 | revisit=2027-05-31

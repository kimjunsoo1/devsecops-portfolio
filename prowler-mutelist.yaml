### Prowler Mutelist — devsecops-portfolio
###
### 계정 전역 Prowler 스캔(63개 고유 FAIL)을 전수 분류한 결과다.
### 억제엔 반드시 분류 + 근거 + 기한을 단다(Checkov check-suppressions.py 와 동일 철학).
### 검증: scripts/check-prowler-mutelist.py
### 적용: prowler aws -f ap-northeast-2 --mutelist prowler-mutelist.yaml
###
### 분류:
###   [N/A]     단일 계정 조직/미사용 서비스 등 구조적으로 성립 불가 → permanent
###   [ACCEPT]  개인 포트폴리오 범위에서 비용/운영상 의도적으로 안 함 → permanent
###   [REVISIT] 할 수 있으나 지금은 보류, 기한 명시 → revisit=YYYY-MM-DD
###
### 억제하지 않은 3건(수정 백로그)은 docs/prowler-triage.md 참조:
###   iam_aws_attached_policy_no_administrative_privileges (CRITICAL)
###   iam_role_administratoraccess_policy (HIGH)
###   accessanalyzer_enabled (LOW, 무료 — 바로 조치 대상)
Mutelist:
  Accounts:
    "*":
      Checks:

        ## ---- HIGH ----
        # [N/A] Bedrock AgentCore 미사용; SSO Admin 롤에 대한 역할분리 오탐 | permanent
        "bedrockagentcore_payments_process_payment_role_separation": { Regions: ["*"], Resources: ["*"] }
        # [N/A] 단일 계정 조직, Config 위임 관리자/조직 애그리게이터 전제 불가 | permanent
        "config_delegated_admin_and_org_aggregator_all_regions": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] GuardDuty 유료 보호플랜; 비용 통제로 '기본만' 선택한 설계결정 | permanent
        "guardduty_ai_protection_enabled": { Regions: ["*"], Resources: ["*"] }
        # [N/A] 단일 계정 조직, GuardDuty 위임 관리자 전제 불가 | permanent
        "guardduty_delegated_admin_enabled_all_regions": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] GuardDuty 유료 런타임 모니터링; '기본만' 설계결정 | permanent
        "guardduty_runtime_monitoring_enabled": { Regions: ["*"], Resources: ["*"] }
        # [REVISIT] 루트 자격증명 관리(중앙화) 활성화 검토 | revisit=2027-05-31
        "iam_root_credentials_management_enabled": { Regions: ["*"], Resources: ["*"] }
        # [REVISIT] 조직 있으므로 SCP 리전 제한 적용 가능, 추후 | revisit=2027-05-31
        "organizations_scp_check_deny_regions": { Regions: ["*"], Resources: ["*"] }
        # [N/A] 단일 계정 조직 + Security Hub 미사용, 위임 관리자 전제 불가 | permanent
        "securityhub_delegated_admin_enabled_all_regions": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] Security Hub 월정액 과금, 개인 포트폴리오 범위 밖 | permanent
        "securityhub_enabled": { Regions: ["*"], Resources: ["*"] }

        ## ---- MEDIUM ----
        # [REVISIT] 보안/청구/운영 대체 연락처 분리 설정, 추후 | revisit=2027-05-31
        "account_maintain_different_contact_details_to_security_billing_and_operations": { Regions: ["*"], Resources: ["*"] }
        # [N/A] Amazon Bedrock 미사용 | permanent
        "bedrock_guardrails_configured": { Regions: ["*"], Resources: ["*"] }
        # [N/A] Amazon Bedrock 미사용 | permanent
        "bedrock_model_invocation_logging_enabled": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] 커스텀 도메인 없음, CloudFront 기본 인증서 사용 | permanent
        "cloudfront_distributions_custom_ssl_certificate": { Regions: ["*"], Resources: ["*"] }
        # [REVISIT] CloudFront 액세스 로깅 활성화 검토 | revisit=2027-05-31
        "cloudfront_distributions_logging_enabled": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] MFA delete 는 루트+CLI 필요로 운영부담; 버전닝+버킷정책으로 보완 | permanent
        "cloudtrail_bucket_requires_mfa_delete": { Regions: ["*"], Resources: ["*"] }
        # [REVISIT] CloudTrail S3 버킷 액세스 로깅 추후 | revisit=2027-05-31
        "cloudtrail_logs_s3_bucket_access_logging_enabled": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] 정적사이트 계정, 네트워크 변경 표면 최소 — 핵심 필터셋에 집중 | permanent
        "cloudwatch_changes_to_network_acls_alarm_configured": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] 정적사이트 계정, 네트워크 변경 표면 최소 | permanent
        "cloudwatch_changes_to_network_gateways_alarm_configured": { Regions: ["*"], Resources: ["*"] }
        # [ACCEPT] 정적사이트 계정, 라우팅 변경 표면 최소 | permanent
        "cloudwatch_changes_to_network_route_tables_alarm_configured": { Regions: ["*"], Resources: ["*"] }
